<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<script>window.__TPF_PARTNER_PREVIEW__ = {{ preview_data|tojson }};</script>
<script src="/static/partner-public/theme.js"></script>
<title>Partner Pool · The Pioneer Forest</title>
<style>
:root{--bg:#041524;--panel:#17435F;--accent:#43DCFF;--spark:#E2AC78;--text:#EEF9FF;--secondary:#28543D}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,sans-serif}
header{padding:20px;max-width:1040px;margin:auto;border-bottom:3px solid var(--accent)}
main{max-width:1040px;margin:40px auto;padding:0 20px}h1{font-size:clamp(32px,6vw,56px);line-height:1.15}
.panel{padding:22px;margin:18px 0;background:var(--panel);border:1px solid var(--secondary);border-radius:15px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:18px}
a{color:var(--accent)}.muted{opacity:.8}.hero{padding:25px 0 40px}small{display:block}.proof{word-break:break-word}
</style>
<div style="background:#fff7d5;color:#2a240c;padding:12px 20px;font-weight:700">LOCAL DESIGN PREVIEW · Changes are not published until you press Publish / sync. <a style="color:#2a240c" href="{{ url_for('partner_detail', partner_id=partner.id) }}">Return to Admin</a>{% if preview_warning %}<p>{{ preview_warning }}</p>{% endif %}</div><header><div class="brand"><img id="header-logo" hidden alt=""><span><strong id="header-name">Partner Pool</strong><small>Partner Pool</small></span></div><span class="tpf-brand">THE PIONEER FOREST<small>Pi-powered Reforestation</small></span></header>
<main><nav id="public-nav" hidden><a id="pool-nav">Pools & impact</a><a id="records-nav">Share records</a><a href="/partner/" class="sign-in">Partner sign in</a></nav><p id="status" role="status">Loading partner records…</p><div id="content"></div><footer id="footer"></footer></main>
<link rel="stylesheet" href="/static/partner-public/omc-layout.css">
<style>
main{max-width:1080px;margin:0 auto}nav a{font-size:.9rem;text-decoration:none;font-weight:700}nav .sign-in{margin-left:auto}.hero{text-align:center;padding:42px 0 28px}.hero img{max-width:220px!important;max-height:220px!important;margin:0 auto 18px}.hero h1{font-size:clamp(2.8rem,6vw,4.5rem);letter-spacing:-.045em;margin:12px 0}.hero p{max-width:740px;margin:12px auto}.section-label{font-size:.76rem;color:var(--accent);letter-spacing:.15em;text-transform:uppercase;font-weight:900}.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin:20px 0 48px}.metrics .panel{margin:0}.metrics strong{display:block;font-size:1.8rem}.pool-card{min-width:0}.pool-card h3{margin-top:0}.pool-numbers{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:20px 0}.pool-numbers div{background:var(--bg);padding:12px;border-radius:10px}.pool-numbers strong{display:block}.bar{height:8px;background:#ffffff25;border-radius:8px;overflow:hidden}.bar span{display:block;height:100%;background:linear-gradient(90deg,var(--secondary),var(--accent))}.record-row{display:flex;justify-content:space-between;gap:15px;align-items:center}.record-row small{display:block}.record-detail{display:grid;grid-template-columns:1fr 1fr;gap:20px}.record-detail canvas{width:100%;border-radius:16px}.record-detail button{margin-right:8px}.proof{overflow-wrap:anywhere}@media(max-width:760px){.metrics{grid-template-columns:repeat(2,1fr)}.record-detail{grid-template-columns:1fr}.record-row{display:block}}
</style>
<link rel="stylesheet" href="/static/partner-public/sandbox-design.css">
<script type="module" src="/static/partner-public/page.js"></script>
</html>
