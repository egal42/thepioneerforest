

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>The Pioneer Forest Project</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background:
        linear-gradient(rgba(0,0,0,0.55), rgba(0,0,0,0.75)),
        radial-gradient(circle at top, #0f5a32 0%, #03170d 70%);
      color: #f2efe6;
      font-family: Georgia, serif;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }

    .card {
      max-width: 520px;
      background: rgba(0, 0, 0, 0.28);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 24px;
      padding: 3rem 2rem;
      backdrop-filter: blur(4px);
      box-shadow: 0 0 30px rgba(0,0,0,0.35);
    }

    h1 {
      font-size: 2.4rem;
      margin-bottom: 1rem;
    }

    p {
      line-height: 1.7;
      opacity: 0.92;
      margin-bottom: 2rem;
    }

    .buttons {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    a {
      text-decoration: none;
      padding: 1rem;
      border-radius: 14px;
      font-weight: bold;
      transition: 0.2s ease;
    }

    .primary {
      background: #d4af37;
      color: #111;
    }

    .secondary {
      background: rgba(255,255,255,0.08);
      color: #f2efe6;
      border: 1px solid rgba(255,255,255,0.08);
    }

    a:hover {
      transform: translateY(-2px);
      opacity: 0.95;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>The Pioneer Forest Project</h1>

    <p>
      A Pi-powered reforestation project focused on
      transparency, real-world impact, and growing forest journeys.
    </p>
    <p style="font-size:0.92rem; opacity:0.72; margin-top:-1rem;">
Best experienced inside Pi Browser.
</p>

     <div class="buttons">
      <a href="#" class="primary">
        Enter with Pi Login
      </a>

      <a href="https://thepioneerforest.netlify.app/" class="secondary">
        Visit Website
      </a>

      <a href="https://fireside.pinet.com/channels/ThePioneerForest" class="secondary">
        TPF Fireside Updates
      </a>
    </div>

    <p style="font-size:0.8rem; opacity:0.55; margin-top:2rem; margin-bottom:0;">
      Development preview — Testnet phase
    </p>
  </div>

</body>
</html>
